name: Seed v2 from standalone source

on:
  push:
    paths:
      - ".github/workflows/seed-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch source baseline
        run: |
          git clone --depth 1 https://github.com/bayurohmat608-create/chat-your-agent-partner-like-human-partner.git /tmp/source

      - name: Copy tracked project source
        run: |
          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             /tmp/source/ ./
          git checkout -- .github/workflows/seed-v2.yml

      - name: Commit v2 baseline
        run: |
          git config user.name "BayStudio CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: seed v2 from latest standalone source"
          git push
