name: v2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop runtime verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: |
          node --check server.js
          node --check cli.js

      - name: Runtime doctor
        run: npm run doctor

      - name: Backend smoke test
        run: npm test

      - name: Verify npm dependency health
        run: npm audit --audit-level=high

  android:
    name: Android API 36 · ${{ matrix.runtime_abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime_abi: [arm64-v8a, x86_64]
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android sdkmanager
        id: android-sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -uo pipefail
          yes | "${{ steps.android-sdk.outputs.sdkmanager }}" --licenses >/dev/null || true

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.android-sdk.outputs.sdkmanager }}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -d "$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Lint and assemble debug APK
        working-directory: android
        run: gradle --no-daemon --console=plain -PruntimeAbi=${{ matrix.runtime_abi }} lintDebug assembleDebug

      - name: Verify APK and 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          sha256sum "$APK"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report-${{ matrix.runtime_abi }}
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-ai-team-v2-debug-${{ matrix.runtime_abi }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
